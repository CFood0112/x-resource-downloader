<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X 喜欢视频下载器</title>
<style>
:root {
  --bg: #0e1419;
  --panel: #151d24;
  --panel-2: #1a242d;
  --border: #26333e;
  --text: #e6edf3;
  --muted: #93a4b1;
  --accent: #2dd4bf;
  --accent-2: #38bdf8;
  --warn: #fbbf24;
  --danger: #f87171;
  --ok: #4ade80;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
}

.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.brand {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0;
}

.conn {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: var(--panel);
  font-size: 12px;
}

.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px;
  align-items: start;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.control-panel h2,
.main-panel h2 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: none;
}

.control-panel h2:not(:first-child) {
  margin-top: 18px;
}

.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  padding: 0 10px;
}

button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

button.danger {
  border-color: #5f2d33;
  color: var(--danger);
}

button.danger:hover:not(:disabled) {
  border-color: var(--danger);
}

button.secondary {
  width: 100%;
  margin-top: 12px;
}

.field {
  margin-top: 12px;
}

.field label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 12px;
}

input[type="number"],
input[type="text"],
select,
textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
}

textarea {
  resize: vertical;
  line-height: 1.4;
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
}

.check input {
  width: auto;
}

.status-note {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}

.status-row {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.stat {
  min-width: 0;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}

.stat .label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 6px;
}

.stat .value {
  display: block;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat .value.small {
  font-size: 12px;
  font-weight: 400;
}

.progress-wrap {
  height: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  overflow: hidden;
  margin-bottom: 18px;
}

.progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transition: width 0.25s ease;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 12px;
}

.progress-percent {
  color: var(--accent);
  font-weight: 600;
}

.progress-line {
  margin: 8px 0 18px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.log {
  width: 100%;
  height: 300px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.45;
  white-space: pre;
  overflow: auto;
}

.log.failure {
  height: 150px;
  color: #fecaca;
}

.status-done { color: var(--ok); }
.status-error { color: var(--danger); }
.status-collecting { color: var(--accent-2); }
.status-downloading { color: var(--accent); }
.status-cancelled { color: var(--warn); }

@media (max-width: 980px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .status-row {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">X 喜欢视频下载器</div>
    <div class="conn" id="conn">连接中</div>
  </header>

  <main class="layout">
    <aside class="panel control-panel">
      <h2>任务</h2>
      <div class="btn-grid">
        <button data-run="50">最近 50 条</button>
        <button data-run="100">最近 100 条</button>
        <button data-run="custom">自定义数量</button>
        <button data-run="download">只下载新增</button>
        <button data-run="manual">手动链接</button>
        <button id="cancel" class="danger" disabled>停止</button>
      </div>

      <div class="field">
        <label for="count">采集数量</label>
        <input id="count" type="number" min="1" value="50">
      </div>

      <div class="field">
        <label for="manualLinks">手动链接（每行一个）</label>
        <textarea id="manualLinks" rows="6" placeholder="https://x.com/..."></textarea>
      </div>

      <h2>设置</h2>
      <div class="field">
        <label for="folderMode">文件夹结构</label>
        <select id="folderMode">
          <option value="flat">全部放在 videos</option>
          <option value="uploader">按发布者</option>
          <option value="month">按月份</option>
          <option value="uploader_month">发布者 + 月份</option>
        </select>
      </div>

      <div class="field">
        <label for="nameMode">命名格式</label>
        <select id="nameMode">
          <option value="structured">日期-发布者-ID</option>
          <option value="structured_title">日期-发布者-ID-短标题</option>
        </select>
      </div>

      <div class="field">
        <label for="proxy">代理</label>
        <select id="proxy">
          <option value="auto">自动</option>
          <option value="off">关闭</option>
          <option value="custom">自定义</option>
        </select>
      </div>

      <div class="field">
        <label for="proxyUrl">代理地址</label>
        <input id="proxyUrl" type="text" placeholder="http://127.0.0.1:7890">
      </div>

      <label class="check">
        <input id="forceRedownload" type="checkbox">
        强制重新下载已下载过的视频
      </label>

      <label class="check">
        <input id="useDownloadAccount" type="checkbox">
        使用独立下载账号（小号）
      </label>
      <button id="loginDownload" data-run="login_download" class="secondary">登录下载小号</button>
      <div id="downloadAccountStatus" class="status-note">未登录</div>

      <button id="saveSettings" class="secondary">保存设置</button>
    </aside>

    <section class="panel main-panel">
      <div class="status-row">
        <div class="stat">
          <span class="label">状态</span>
          <span class="value" id="status">空闲</span>
        </div>
        <div class="stat">
          <span class="label">当前文件</span>
          <span class="value small" id="currentFile">-</span>
        </div>
        <div class="stat">
          <span class="label">第几个</span>
          <span class="value" id="index">-</span>
        </div>
        <div class="stat">
          <span class="label">网速</span>
          <span class="value" id="speed">-</span>
        </div>
        <div class="stat">
          <span class="label">剩余时间</span>
          <span class="value" id="eta">-</span>
        </div>
        <div class="stat">
          <span class="label">已用时</span>
          <span class="value" id="elapsed">-</span>
        </div>
      </div>

      <div class="progress-head">
        <span>下载进度</span>
        <span id="percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-wrap">
        <div class="progress" id="progress"></div>
      </div>
      <div class="progress-line" id="progressLine">-</div>

      <h2>运行日志</h2>
      <textarea id="log" class="log" readonly></textarea>

      <h2>失败列表</h2>
      <textarea id="failures" class="log failure" readonly></textarea>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastState = null;

function statusText(status) {
  return {
    idle: '空闲',
    starting: '准备中',
    collecting: '采集中',
    downloading: '下载中',
    done: '完成',
    error: '出错',
    cancelled: '已停止',
  }[status] || status;
}

function fmtTime(sec) {
  sec = Number(sec) || 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function applyState(payload) {
  const s = payload.state;
  lastState = payload;

  $('status').textContent = statusText(s.status);
  $('status').className = `value status-${s.status}`;
  $('currentFile').textContent = s.currentFile || '-';
  $('index').textContent =
    s.fileCount > 0 || s.currentIndex > 0
      ? `${s.currentIndex}/${s.totalLinks || '-'}`
      : s.totalLinks > 0
        ? `0/${s.totalLinks}`
        : '-';
  $('speed').textContent = s.speed || '-';
  $('eta').textContent = s.eta || '-';
  $('elapsed').textContent = fmtTime(s.elapsed);
  $('percent').textContent = `${Math.round(s.percent || 0)}%`;
  $('progressLine').textContent = s.progressLine || '-';
  $('progress').style.width = `${Math.min(100, Math.max(0, s.percent))}%`;
  $('log').value = s.logs.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  $('failures').value = s.failures
    .map((f) => `${f.url || '(未知链接)'}\n  ${f.message}`)
    .join('\n');

  const running = !!s.running;
  document.querySelectorAll('[data-run]').forEach((b) => {
    b.disabled = running;
  });
  $('cancel').disabled = !running;
  $('saveSettings').disabled = running;

  if (payload.settings) {
    $('folderMode').value = payload.settings.folderMode || 'flat';
    $('nameMode').value = payload.settings.nameMode || 'structured';
    $('proxy').value = payload.settings.proxy || 'auto';
    $('proxyUrl').value = payload.settings.proxyUrl || '';
    $('forceRedownload').checked = !!payload.settings.forceRedownload;
    $('useDownloadAccount').checked = !!payload.settings.useDownloadAccount;
    $('downloadAccountStatus').textContent = payload.config.downloadAccountReady
      ? `已配置 ${payload.config.downloadCookiesFile}`
      : '未登录';
  }
}

async function saveSettings() {
  const settings = {
    folderMode: $('folderMode').value,
    nameMode: $('nameMode').value,
    proxy: $('proxy').value,
    proxyUrl: $('proxyUrl').value.trim(),
    forceRedownload: $('forceRedownload').checked,
    useDownloadAccount: $('useDownloadAccount').checked,
  };
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ settings }),
  });
}

document.querySelectorAll('[data-run]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const mode = btn.dataset.run;
    const body = { mode };
    if (mode === 'custom') {
      body.count = Number($('count').value);
    }
    if (mode === 'manual') {
      body.links = $('manualLinks').value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);
    }
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || '启动失败');
    }
  });
});

$('cancel').addEventListener('click', async () => {
  await fetch('/api/cancel', { method: 'POST' });
});

$('saveSettings').addEventListener('click', async () => {
  await saveSettings();
  const res = await fetch('/api/state');
  applyState(await res.json());
});

const es = new EventSource('/api/events');
es.onmessage = (e) => {
  const payload = JSON.parse(e.data);
  if (
    payload.type === 'hello' ||
    payload.type === 'state' ||
    payload.type === 'progress' ||
    payload.type === 'failures' ||
    payload.type === 'settings'
  ) {
    applyState(payload);
  }
};
es.onerror = () => {
  $('conn').textContent = '连接断开';
};

window.addEventListener('pagehide', () => {
  navigator.sendBeacon('/api/gui-close', 'close');
});

fetch('/api/state')
  .then((r) => r.json())
  .then((payload) => {
    $('conn').textContent = '已连接';
    applyState(payload);
  })
  .catch(() => {
    $('conn').textContent = '无法连接';
  });
</script>
</body>
</html>
