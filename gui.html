<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X 资源下载器</title>
<style>
:root {
  --bg: #0e1419;
  --panel: #151d24;
  --panel-2: #1a242d;
  --border: #26333e;
  --text: #e6edf3;
  --muted: #93a4b1;
  --accent: #2dd4bf;
  --accent-2: #38bdf8;
  --warn: #fbbf24;
  --danger: #f87171;
  --ok: #4ade80;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 14px;
}

.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.brand {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0;
}

.conn {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: var(--panel);
  font-size: 12px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.exit-btn {
  width: auto;
  height: 30px;
  margin-top: 0;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.tab {
  width: auto;
  height: 34px;
}

.tab.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--panel-2);
}

.view {
  display: none;
}

.view.active {
  display: block;
}

.settings-wide {
  grid-column: 1 / -1;
}

.settings-wide h2 {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--muted);
}

.settings-wide h2:not(:first-child) {
  margin-top: 18px;
}

.dir-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.dir-row input {
  flex: 1;
}

.browse-btn {
  width: auto;
  height: 32px;
  margin: 0;
}

.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px;
  align-items: start;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}

.control-panel h2,
.main-panel h2 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: none;
}

.control-panel h2:not(:first-child) {
  margin-top: 18px;
}

.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  padding: 0 10px;
}

button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

button.danger {
  border-color: #5f2d33;
  color: var(--danger);
}

button.danger:hover:not(:disabled) {
  border-color: var(--danger);
}

button.warn-btn {
  border-color: #6b5426;
  color: var(--warn);
}

button.warn-btn:hover:not(:disabled) {
  border-color: var(--warn);
}

button.secondary {
  width: 100%;
  margin-top: 12px;
}

.field {
  margin-top: 12px;
}

.field label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 12px;
}

input[type="number"],
input[type="text"],
select,
textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
}

textarea {
  resize: vertical;
  line-height: 1.4;
}

.check {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
}

.check input {
  width: auto;
}

.status-note {
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}

.failure-list {
  max-height: 180px;
  overflow: auto;
}

.failure-item {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  line-height: 1.4;
}

.failure-item img {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--panel-2);
  flex-shrink: 0;
}

.failure-meta {
  min-width: 0;
  word-break: break-all;
}

.failure-badge {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 6px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal {
  width: min(680px, 92vw);
  max-height: 82vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}

.modal h2 {
  margin: 0 0 12px;
  font-size: 16px;
}

.status-row {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.stat {
  min-width: 0;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}

.stat .label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 6px;
}

.stat .value {
  display: block;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat .value.small {
  font-size: 12px;
  font-weight: 400;
}

.progress-wrap {
  height: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  overflow: hidden;
  margin-bottom: 18px;
}

.progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transition: width 0.25s ease;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 12px;
}

.progress-percent {
  color: var(--accent);
  font-weight: 600;
}

.progress-line {
  margin: 8px 0 18px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.log {
  width: 100%;
  height: 300px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.45;
  white-space: pre;
  overflow: auto;
}

.log.failure {
  height: 150px;
  color: #fecaca;
}

.status-done { color: var(--ok); }
.status-error { color: var(--danger); }
.status-collecting { color: var(--accent-2); }
.status-downloading { color: var(--accent); }
.status-cancelled { color: var(--warn); }

@media (max-width: 980px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .status-row {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">X 资源下载器</div>
    <div class="top-actions">
      <div class="conn" id="conn">连接中</div>
      <span id="queueInfo" class="conn">队列 0</span>
      <button id="pauseQueue" class="secondary exit-btn">暂停队列</button>
      <button id="exitGui" class="secondary exit-btn">退出</button>
    </div>
  </header>

  <div class="tabs">
    <button id="tabVideo" class="tab active">视频</button>
    <button id="tabImages" class="tab">图片</button>
    <button id="tabSettings" class="tab">设置</button>
  </div>

  <div id="viewVideo" class="view active">
  <main class="layout">
    <aside class="panel control-panel">
      <h2>任务</h2>
      <div class="btn-grid">
        <button data-run="50">最近 50 条</button>
        <button data-run="100">最近 100 条</button>
        <button data-run="custom">自定义数量</button>
        <button data-run="download">只下载新增</button>
        <button data-run="manual">手动链接</button>
        <button data-run="refresh">刷新喜欢</button>
        <button data-run="backfill">从最早补录</button>
        <button id="skipCurrent" class="warn-btn" disabled>跳过当前</button>
        <button id="cancel" class="danger" disabled>停止</button>
      </div>

      <div class="field">
        <label for="videoSource">视频来源</label>
        <select id="videoSource">
          <option value="likes">喜欢</option>
          <option value="bookmarks">书签</option>
          <option value="search">搜索结果</option>
          <option value="replies">我的回复</option>
          <option value="following">关注列表</option>
          <option value="list">自定义列表</option>
        </select>
      </div>
      <div class="field" id="videoSourceExtraWrap" style="display:none">
        <label for="videoSourceExtra">关键词或列表链接</label>
        <input id="videoSourceExtra" type="text" placeholder="https://x.com/i/lists/...">
      </div>

      <div class="field">
        <label for="count">数量</label>
        <input id="count" type="number" min="1" value="50">
      </div>

      <div class="field">
        <label for="manualLinks">手动链接（每行一个）</label>
        <textarea id="manualLinks" rows="6" placeholder="https://x.com/..."></textarea>
      </div>

    </aside>

    <section class="panel main-panel">
      <div class="status-row">
        <div class="stat">
          <span class="label">状态</span>
          <span class="value" id="status">空闲</span>
        </div>
        <div class="stat">
          <span class="label">当前文件</span>
          <span class="value small" id="currentFile">-</span>
        </div>
        <div class="stat">
          <span class="label">第几个</span>
          <span class="value" id="index">-</span>
        </div>
        <div class="stat">
          <span class="label">网速</span>
          <span class="value" id="speed">-</span>
        </div>
        <div class="stat">
          <span class="label">剩余时间</span>
          <span class="value" id="eta">-</span>
        </div>
        <div class="stat">
          <span class="label">已用时</span>
          <span class="value" id="elapsed">-</span>
        </div>
      </div>

      <div class="progress-head">
        <span>下载进度</span>
        <span id="percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-wrap">
        <div class="progress" id="progress"></div>
      </div>
      <div class="progress-line" id="progressLine">-</div>

      <label class="check">
        <input id="onlyErrorsVideo" type="checkbox">
        只看错误
      </label>
      <h2>运行日志</h2>
      <textarea id="log" class="log" readonly></textarea>

      <h2>失败列表</h2>
      <div id="failuresList" class="failure-list"></div>
      <button id="fillVideoFailures" class="secondary">失败链接 → 手动链接</button>
    </section>
  </main>
  </div>

  <div id="viewImages" class="view">
    <main class="layout">
      <aside class="panel control-panel">
        <h2>任务</h2>
        <div class="btn-grid">
          <button data-run="images" data-count="20">最近 20 条</button>
          <button data-run="images" data-count="50">最近 50 条</button>
          <button data-run="images" data-count="custom">自定义数量</button>
          <button data-run="images" data-count="50">只下载新增</button>
          <button data-run="images_manual">手动链接</button>
          <button data-run="images" data-count="20">刷新图片</button>
          <button data-run="images_backfill" data-count="custom">从最早补录</button>
          <button id="skipCurrentImage" class="warn-btn" disabled>跳过当前</button>
          <button id="cancelImage" class="danger" disabled>停止</button>
        </div>
        <div class="field">
          <label for="imageSource">图片来源</label>
          <select id="imageSource">
            <option value="likes">喜欢</option>
            <option value="bookmarks">书签</option>
            <option value="search">搜索结果</option>
            <option value="replies">我的回复</option>
            <option value="following">关注列表</option>
            <option value="list">自定义列表</option>
          </select>
        </div>
        <div class="field" id="imageSourceExtraWrap" style="display:none">
          <label for="imageSourceExtra">关键词或列表链接</label>
          <input id="imageSourceExtra" type="text" placeholder="https://x.com/i/lists/...">
        </div>
        <div class="field">
          <label for="imageCount">数量</label>
          <input id="imageCount" type="number" min="1" value="50">
        </div>
        <div class="field">
          <label for="imageManualLinks">手动链接（每行一个）</label>
          <textarea id="imageManualLinks" rows="5" placeholder="https://x.com/... 或 https://pbs.twimg.com/media/..."></textarea>
        </div>
      </aside>
      <section class="panel main-panel">
        <div class="status-row">
          <div class="stat">
            <span class="label">状态</span>
            <span class="value" id="imageStatus">空闲</span>
          </div>
          <div class="stat">
            <span class="label">当前图片</span>
            <span class="value small" id="imageCurrentFile">-</span>
          </div>
          <div class="stat">
            <span class="label">第几张</span>
            <span class="value" id="imageIndex">-</span>
          </div>
          <div class="stat">
            <span class="label">网速</span>
            <span class="value" id="imageSpeed">-</span>
          </div>
          <div class="stat">
            <span class="label">剩余时间</span>
            <span class="value" id="imageEta">-</span>
          </div>
          <div class="stat">
            <span class="label">已用时</span>
            <span class="value" id="imageElapsed">-</span>
          </div>
        </div>
        <div class="progress-head">
          <span>下载进度</span>
          <span id="imagePercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-wrap">
          <div class="progress" id="imageProgress"></div>
        </div>
        <div class="progress-line" id="imageProgressLine">-</div>
        <label class="check">
          <input id="onlyErrorsImage" type="checkbox">
          只看错误
        </label>
        <h2>运行日志</h2>
        <textarea id="imageLog" class="log" readonly></textarea>
        <h2>失败列表</h2>
        <div id="imageFailuresList" class="failure-list"></div>
        <button id="fillImageFailures" class="secondary">失败链接 → 手动链接</button>
      </section>
    </main>
  </div>

  <div id="viewSettings" class="view">
    <main class="layout">
      <section class="panel settings-wide">
        <h2>视频设置</h2>
        <div class="field">
          <label for="videoFolderMode">文件夹结构</label>
          <select id="videoFolderMode">
            <option value="flat">全部放在视频目录</option>
            <option value="uploader">按发布者</option>
            <option value="month">按月份</option>
            <option value="uploader_month">发布者 + 月份</option>
          </select>
        </div>
        <div class="field">
          <label for="videoNameMode">命名格式</label>
          <select id="videoNameMode">
            <option value="structured">日期-发布者-ID</option>
            <option value="structured_title">日期-发布者-ID-短标题</option>
          </select>
        </div>
        <div class="field">
          <label for="videoDownloadDir">下载位置</label>
          <div class="dir-row">
            <input id="videoDownloadDir" type="text" value="videos">
            <button id="browseVideoDir" class="browse-btn">选择</button>
          </div>
        </div>

        <h2>图片设置</h2>
        <div class="field">
          <label for="imageFolderMode">文件夹结构</label>
          <select id="imageFolderMode">
            <option value="flat">全部放在图片目录</option>
            <option value="uploader">按发布者</option>
            <option value="month">按月份</option>
            <option value="uploader_month">发布者 + 月份</option>
          </select>
        </div>
        <div class="field">
          <label for="imageNameMode">命名格式</label>
          <select id="imageNameMode">
            <option value="media_id">媒体 ID</option>
            <option value="full">媒体 ID-推文 ID</option>
          </select>
        </div>
        <div class="field">
          <label for="imageDownloadDir">下载位置</label>
          <div class="dir-row">
            <input id="imageDownloadDir" type="text" value="images">
            <button id="browseImageDir" class="browse-btn">选择</button>
          </div>
        </div>

        <h2>通用设置</h2>
        <div class="field">
          <label for="proxy">代理</label>
          <select id="proxy">
            <option value="auto">自动</option>
            <option value="off">关闭</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="field">
          <label for="proxyUrl">代理地址</label>
          <input id="proxyUrl" type="text" placeholder="http://127.0.0.1:7890">
        </div>
        <label class="check">
          <input id="forceRedownload" type="checkbox">
          强制重新下载已下载过的视频
        </label>
        <label class="check">
          <input id="useDownloadAccount" type="checkbox">
          使用独立下载账号（小号）
        </label>
        <button id="loginMain" data-run="login_main" class="secondary">更换主账号</button>
        <button id="loginDownload" data-run="login_download" class="secondary">更换/登录小号</button>
        <div class="field">
          <label for="accountName">小号名称（可选，用于账号池）</label>
          <input id="accountName" type="text" placeholder="例如 acc1">
        </div>
        <div id="accountPoolStatus" class="status-note">无小号</div>
        <div id="downloadAccountStatus" class="status-note">未登录</div>
        <button id="saveSettings" class="secondary">保存设置</button>

        <h2>任务历史</h2>
        <div id="jobHistory" class="failure-list"></div>
        <button id="refreshJobs" class="secondary">刷新任务历史</button>
      </section>
    </main>
  </div>
</div>

<div id="wizardOverlay" class="modal-overlay">
  <div class="modal">
    <h2>首次使用设置</h2>
    <div class="field">
      <label>1. 登录主账号</label>
      <button data-run="login_main" class="secondary">登录主账号</button>
    </div>
    <div class="field">
      <label>2. 登录小号（可选）</label>
      <button data-run="login_download" class="secondary">登录小号</button>
    </div>
    <div class="field">
      <label>3. 选择下载目录</label>
      <div class="dir-row">
        <input id="wizardVideoDir" type="text" value="data/videos">
        <button id="browseWizardVideo" class="browse-btn">选择</button>
      </div>
      <div class="dir-row">
        <input id="wizardImageDir" type="text" value="data/images">
        <button id="browseWizardImage" class="browse-btn">选择</button>
      </div>
    </div>
    <div class="field">
      <label>4. 完成</label>
      <button id="finishWizard" class="secondary">完成</button>
      <button id="skipWizard" class="secondary">跳过</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastState = null;
let currentVideoFailures = [];
let currentImageFailures = [];

function statusText(status) {
  return {
    idle: '空闲',
    starting: '准备中',
    collecting: '采集中',
    downloading: '下载中',
    collecting_images: '采集中',
    downloading_images: '下载中',
    done: '完成',
    error: '出错',
    cancelled: '已停止',
  }[status] || status;
}

function fmtTime(sec) {
  sec = Number(sec) || 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderFailures(containerId, failures) {
  const container = $(containerId);
  container.innerHTML = failures
    .map((f) => {
      const img = f.thumbUrl
        ? `<img src="${escapeHtml(f.thumbUrl)}" alt="" loading="lazy">`
        : '';
      const retry = f.attempts
        ? `<span class="failure-badge">第 ${f.attempts}/${f.maxAttempts} 次</span>`
        : '';
      const cat = f.category ? `<span class="failure-badge">${escapeHtml(f.category)}</span>` : '';
      return `<div class="failure-item">${img}<div class="failure-meta">${retry}${cat}<div>${escapeHtml(f.url || '(未知链接)')}</div><div>${escapeHtml(f.message)}</div></div></div>`;
    })
    .join('');
}

function renderLog(entries, onlyErrors) {
  const list = (entries || []).filter((e) => !onlyErrors || e.level === 'error');
  return list
    .map((e) => {
      if (typeof e === 'string') return e;
      return `[${e.taskId || '-'}] [${e.source || '-'}] [${e.mediaId || '-'}] [${fmtTime(e.elapsed || 0)}] ${e.message}`;
    })
    .join('\n');
}

function updateLogTextarea(el, text) {
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.value = text;
  if (nearBottom) el.scrollTop = el.scrollHeight;
}

function applyState(payload) {
  const s = payload.state;
  lastState = payload;
  const kind = s.kind || '';
  const idlePanel = {
    status: 'idle',
    currentFile: '',
    currentIndex: 0,
    fileCount: 0,
    totalLinks: 0,
    percent: 0,
    speed: '',
    eta: '',
    elapsed: 0,
    progressLine: '',
    logs: [],
    failures: [],
  };
  const vs = kind === '' || kind === 'video' ? s : idlePanel;
  const is = kind === '' || kind === 'images' ? s : idlePanel;

  const indexTextFor = (st) =>
    st.fileCount > 0 || st.currentIndex > 0
      ? `${st.currentIndex}/${st.totalLinks || '-'}`
      : st.totalLinks > 0
        ? `0/${st.totalLinks}`
        : '-';

  $('status').textContent = statusText(vs.status);
  $('status').className = `value status-${vs.status}`;
  $('currentFile').textContent = vs.currentFile || '-';
  $('index').textContent = indexTextFor(vs);
  $('speed').textContent = vs.speed || '-';
  $('eta').textContent = vs.eta || '-';
  $('elapsed').textContent = fmtTime(vs.elapsed);
  $('percent').textContent = `${Math.round(vs.percent || 0)}%`;
  $('progressLine').textContent = vs.progressLine || '-';
  $('progress').style.width = `${Math.min(100, Math.max(0, vs.percent))}%`;
  updateLogTextarea($('log'), renderLog(vs.logEntries || vs.logs, $('onlyErrorsVideo').checked));
  const lastKind = payload.lastFailuresKind || '';
  const lastFailures = payload.lastFailures || [];
  currentVideoFailures = vs.failures.length
    ? vs.failures
    : lastKind === 'video'
      ? lastFailures
      : [];
  currentImageFailures = is.failures.length
    ? is.failures
    : lastKind === 'images'
      ? lastFailures
      : [];
  renderFailures('failuresList', currentVideoFailures);

  $('imageStatus').textContent = statusText(is.status);
  $('imageStatus').className = `value status-${is.status}`;
  $('imageCurrentFile').textContent = is.currentFile || '-';
  $('imageIndex').textContent = indexTextFor(is);
  $('imageSpeed').textContent = is.speed || '-';
  $('imageEta').textContent = is.eta || '-';
  $('imageElapsed').textContent = fmtTime(is.elapsed);
  $('imagePercent').textContent = `${Math.round(is.percent || 0)}%`;
  $('imageProgressLine').textContent = is.progressLine || '-';
  $('imageProgress').style.width = `${Math.min(100, Math.max(0, is.percent))}%`;
  updateLogTextarea($('imageLog'), renderLog(is.logEntries || is.logs, $('onlyErrorsImage').checked));
  renderFailures('imageFailuresList', currentImageFailures);
  $('fillVideoFailures').disabled = !currentVideoFailures.length;
  $('fillImageFailures').disabled = !currentImageFailures.length;
  $('queueInfo').textContent = `队列 ${payload.queueLength || 0}`;
  $('pauseQueue').textContent = payload.queuePaused ? '恢复队列' : '暂停队列';

  if (payload.settings) {
    const wizardDone = !!payload.settings.wizardDone;
    $('wizardOverlay').style.display = wizardDone ? 'none' : 'flex';
    $('wizardVideoDir').value = $('videoDownloadDir').value || 'data/videos';
    $('wizardImageDir').value = $('imageDownloadDir').value || 'data/images';
  }

  const running = !!s.running;
  document.querySelectorAll('[data-run]').forEach((b) => {
    b.disabled = running;
  });
  $('cancel').disabled = !running;
  $('cancelImage').disabled = !running;
  const canSkip =
    running && (s.status === 'downloading' || s.status === 'downloading_images');
  $('skipCurrent').disabled = !canSkip;
  $('skipCurrentImage').disabled = !canSkip;
  $('saveSettings').disabled = running;

  if (payload.settings) {
    const videoSettings = payload.settings.video || {};
    const imageSettings = payload.settings.image || {};
    $('videoFolderMode').value = videoSettings.folderMode || 'flat';
    $('videoNameMode').value = videoSettings.nameMode || 'structured';
    $('videoDownloadDir').value = videoSettings.downloadDir || 'videos';
    $('imageFolderMode').value = imageSettings.folderMode || 'flat';
    $('imageNameMode').value = imageSettings.nameMode || 'media_id';
    $('imageDownloadDir').value = imageSettings.downloadDir || 'images';
    $('proxy').value = payload.settings.proxy || 'auto';
    $('proxyUrl').value = payload.settings.proxyUrl || '';
    $('forceRedownload').checked = !!payload.settings.forceRedownload;
    $('useDownloadAccount').checked = !!payload.settings.useDownloadAccount;
    $('downloadAccountStatus').textContent = payload.config.downloadAccountReady
      ? `已配置 ${payload.config.downloadCookiesFile}`
      : '未登录';
    const accounts = payload.config.downloadAccounts || [];
    $('accountPoolStatus').textContent = accounts.length
      ? `账号池：${accounts.join(', ')}`
      : '无小号';
  }
}

async function saveSettings() {
  const settings = {
    video: {
      folderMode: $('videoFolderMode').value,
      nameMode: $('videoNameMode').value,
      downloadDir: $('videoDownloadDir').value.trim() || 'videos',
    },
    image: {
      folderMode: $('imageFolderMode').value,
      nameMode: $('imageNameMode').value,
      downloadDir: $('imageDownloadDir').value.trim() || 'images',
    },
    proxy: $('proxy').value,
    proxyUrl: $('proxyUrl').value.trim(),
    forceRedownload: $('forceRedownload').checked,
    useDownloadAccount: $('useDownloadAccount').checked,
    wizardDone: $('wizardOverlay').style.display === 'none',
  };
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ settings }),
  });
}

document.querySelectorAll('[data-run]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const mode = btn.dataset.run;
    const body = { mode };
    if (mode === 'custom') {
      body.count = Number($('count').value);
    }
    if (mode === 'manual') {
      body.links = $('manualLinks').value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);
    }
    if (mode === 'login_download') {
      body.accountName = $('accountName').value.trim();
    }
    if (mode === 'images') {
      body.source = $('imageSource').value;
      body.extra = ['search', 'list'].includes(body.source)
        ? $('imageSourceExtra').value.trim()
        : '';
      body.count =
        btn.dataset.count === 'custom'
          ? Number($('imageCount').value)
          : Number(btn.dataset.count || 50);
    }
    if (mode === 'images_backfill') {
      body.source = $('imageSource').value;
      body.extra = ['search', 'list'].includes(body.source)
        ? $('imageSourceExtra').value.trim()
        : '';
      body.count =
        btn.dataset.count === 'custom'
          ? Number($('imageCount').value)
          : Number(btn.dataset.count || 50);
    }
    if (mode === 'images_manual') {
      body.links = $('imageManualLinks').value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);
    }
    if (['50', '100', 'custom', 'download', 'refresh', 'backfill'].includes(mode)) {
      body.source = $('videoSource').value;
      body.extra = ['search', 'list'].includes(body.source)
        ? $('videoSourceExtra').value.trim()
        : '';
    }
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || '启动失败');
    }
  });
});

$('cancel').addEventListener('click', async () => {
  await fetch('/api/cancel', { method: 'POST' });
});

$('cancelImage').addEventListener('click', async () => {
  await fetch('/api/cancel', { method: 'POST' });
});

$('skipCurrent').addEventListener('click', async () => {
  const res = await fetch('/api/skip', { method: 'POST' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert(data.error || '跳过失败');
  }
});

$('skipCurrentImage').addEventListener('click', async () => {
  const res = await fetch('/api/skip', { method: 'POST' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert(data.error || '跳过失败');
  }
});

$('fillVideoFailures').addEventListener('click', () => {
  $('manualLinks').value = currentVideoFailures
    .map((f) => f.url)
    .filter(Boolean)
    .join('\n');
});

$('fillImageFailures').addEventListener('click', () => {
  $('imageManualLinks').value = currentImageFailures
    .map((f) => f.url)
    .filter(Boolean)
    .join('\n');
});

function switchView(name) {
  const isVideo = name === 'video';
  const isImages = name === 'images';
  const isSettings = name === 'settings';
  $('viewVideo').classList.toggle('active', isVideo);
  $('viewImages').classList.toggle('active', isImages);
  $('viewSettings').classList.toggle('active', isSettings);
  $('tabVideo').classList.toggle('active', isVideo);
  $('tabImages').classList.toggle('active', isImages);
  $('tabSettings').classList.toggle('active', isSettings);
}

$('tabVideo').addEventListener('click', () => switchView('video'));
$('tabImages').addEventListener('click', () => switchView('images'));
$('tabSettings').addEventListener('click', () => switchView('settings'));

$('saveSettings').addEventListener('click', async () => {
  await saveSettings();
  const res = await fetch('/api/state');
  applyState(await res.json());
});

async function browseDir(inputId) {
  const res = await fetch('/api/browse-dir', { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (data.ok && data.path) {
    $(inputId).value = data.path;
  } else {
    alert('未选择目录');
  }
}

$('browseVideoDir').addEventListener('click', () => browseDir('videoDownloadDir'));
$('browseImageDir').addEventListener('click', () => browseDir('imageDownloadDir'));

$('browseWizardVideo').addEventListener('click', () => browseDir('wizardVideoDir'));
$('browseWizardImage').addEventListener('click', () => browseDir('wizardImageDir'));

async function finishWizard() {
  $('videoDownloadDir').value = $('wizardVideoDir').value.trim() || 'data/videos';
  $('imageDownloadDir').value = $('wizardImageDir').value.trim() || 'data/images';
  $('wizardOverlay').style.display = 'none';
  await saveSettings();
  const res = await fetch('/api/state');
  applyState(await res.json());
}

$('finishWizard').addEventListener('click', finishWizard);
$('skipWizard').addEventListener('click', finishWizard);

$('onlyErrorsVideo').addEventListener('change', () => {
  if (lastState) applyState(lastState);
});
$('onlyErrorsImage').addEventListener('change', () => {
  if (lastState) applyState(lastState);
});

$('pauseQueue').addEventListener('click', async () => {
  const resume = $('pauseQueue').textContent === '恢复队列';
  await fetch(`/api/queue/${resume ? 'resume' : 'pause'}`, { method: 'POST' });
  const res = await fetch('/api/state');
  applyState(await res.json());
});

async function refreshJobs() {
  const res = await fetch('/api/jobs');
  const data = await res.json().catch(() => ({ jobs: [] }));
  $('jobHistory').innerHTML = (data.jobs || [])
    .slice(0, 20)
    .map(
      (j) =>
        `<div class="failure-item"><div class="failure-meta"><div>[${escapeHtml(j.id)}] ${escapeHtml(j.mode)} · ${escapeHtml(j.status)} · ${escapeHtml(j.updatedAt || '')}</div><button data-resume="${escapeHtml(j.id)}">继续</button></div></div>`
    )
    .join('');
  document.querySelectorAll('[data-resume]').forEach((b) => {
    b.addEventListener('click', async () => {
      await fetch('/api/jobs/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: b.dataset.resume }),
      });
      refreshJobs();
    });
  });
}

$('refreshJobs').addEventListener('click', refreshJobs);

function syncSourceExtras() {
  const vs = $('videoSource').value;
  $('videoSourceExtraWrap').style.display =
    vs === 'search' || vs === 'list' ? 'block' : 'none';
  const is = $('imageSource').value;
  $('imageSourceExtraWrap').style.display =
    is === 'search' || is === 'list' ? 'block' : 'none';
}

$('videoSource').addEventListener('change', syncSourceExtras);
$('imageSource').addEventListener('change', syncSourceExtras);
syncSourceExtras();

$('exitGui').addEventListener('click', async () => {
  await fetch('/api/gui-close', { method: 'POST' });
  window.close();
});

const es = new EventSource('/api/events');
es.onmessage = (e) => {
  const payload = JSON.parse(e.data);
  if (
    payload.type === 'hello' ||
    payload.type === 'state' ||
    payload.type === 'progress' ||
    payload.type === 'failures' ||
    payload.type === 'settings'
  ) {
    applyState(payload);
  }
};
es.onerror = () => {
  $('conn').textContent = '连接断开';
};

window.addEventListener('pagehide', () => {
  navigator.sendBeacon('/api/gui-close', 'close');
});

fetch('/api/state')
  .then((r) => r.json())
  .then((payload) => {
    $('conn').textContent = '已连接';
    applyState(payload);
    refreshJobs();
  })
  .catch(() => {
    $('conn').textContent = '无法连接';
  });
</script>
</body>
</html>
