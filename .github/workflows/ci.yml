name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax check
        run: |
          find . -path './node_modules' -prune -o -path './release' -prune -o \
            -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
